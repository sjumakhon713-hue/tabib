<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<meta name="description" content="Табиб — духтур, клиника ва ёрии таъҷилӣ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Табиб — духтур, клиника ва ёрии таъҷилӣ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@600;700;800&display=swap">
<style>
  :root{--bg:#0B0F17;--bg2:#111722;--card:#161D2A;--card2:#1D2535;--line:#263044;--slate:#E8ECF2;--muted:#8D97AB;--red:#FF4D57;--red2:#3A1C24;--green:#2FD08C;--green2:#123327;--blue:#5B9BFF;--blue2:#17284A;--amber:#FFB547;--amber2:#3A2C12;--violet:#9B7BFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Arial,sans-serif;background:#05070B;color:var(--slate);display:flex;justify-content:center;font-size:15px}
  .phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
  .cond{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:-.02em}
  header.top{background:radial-gradient(120% 140% at 0% 0%,#1B2A4A 0%,#0B0F17 60%);padding:18px 18px 20px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  header.top svg.ecg{position:absolute;left:0;right:0;bottom:4px;width:100%;height:40px;opacity:.35}
  header.top svg.ecg path{stroke:var(--red)}
  .brand{display:flex;align-items:center;justify-content:space-between;position:relative}
  .logo{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:.08em}
  .cross{width:30px;height:30px;background:linear-gradient(135deg,#FF6B73,#E1333E);border-radius:10px;position:relative;box-shadow:0 0 18px rgba(255,77,87,.55)}
  .cross::before,.cross::after{content:'';position:absolute;background:#fff;border-radius:2px}
  .cross::before{left:12px;top:6px;width:6px;height:18px}.cross::after{left:6px;top:12px;width:18px;height:6px}
  .citybtn{background:var(--card2);border:1px solid var(--line);color:var(--slate);border-radius:999px;padding:8px 13px;font:600 13px Inter,sans-serif;cursor:pointer}
  main{flex:1;padding:16px 16px 112px}
  h1{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
  h2{font-size:19px;font-weight:800;margin:22px 0 12px;letter-spacing:-.01em}
  h3{font-size:15.5px;font-weight:700}
  .muted{color:var(--muted);font-size:13.5px}
  .card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
  .row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
  .sos{background:radial-gradient(120% 160% at 100% 0%,#FF7A82 0%,#E1333E 45%,#9E1622 100%);color:#fff;border-radius:26px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;box-shadow:0 14px 40px rgba(255,77,87,.35);position:relative;overflow:hidden}
  .sos .ring{width:70px;height:70px;border-radius:50%;background:#fff;color:#E1333E;display:flex;align-items:center;justify-content:center;font:800 24px Inter,sans-serif;flex:none;box-shadow:0 0 0 9px rgba(255,255,255,.18),0 0 0 18px rgba(255,255,255,.08)}
  .sos h3{font-size:19px;letter-spacing:.06em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;cursor:pointer}
  .tile .ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px}
  .specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .spec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 4px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:600;color:#C7CFDC}
  .spec .e{font-size:22px;display:block;margin-bottom:5px}
  .spec.on{border-color:var(--blue);background:var(--blue2);color:#fff}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
  .chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font:600 13px Inter,sans-serif;white-space:nowrap;cursor:pointer;color:#C7CFDC}
  .chips button.on{background:var(--blue);color:#06101F;border-color:var(--blue)}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:10px}
  .search input,.search input[type=text]{border:none;outline:none;flex:1;padding:13px 0;margin:0;font:500 15px Inter,sans-serif;background:none;color:var(--slate)}
  .doc{display:flex;gap:12px;cursor:pointer}
  .ava{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:800 20px Inter,sans-serif;flex:none;color:#fff}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin:5px 4px 0 0}
  .t-green{background:var(--green2);color:var(--green)}.t-red{background:var(--red2);color:#FF8A91}.t-blue{background:var(--blue2);color:var(--blue)}.t-amber{background:var(--amber2);color:var(--amber)}.t-grey{background:#222A38;color:var(--muted)}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font:700 15px Inter,sans-serif;cursor:pointer;background:var(--blue);color:#06101F;text-align:center;text-decoration:none}
  .btn.red{background:linear-gradient(135deg,#FF6B73,#E1333E);color:#fff;box-shadow:0 10px 26px rgba(255,77,87,.3)}.btn.light{background:var(--card2);color:var(--slate);border:1px solid var(--line)}.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--slate)}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  nav{position:fixed;bottom:12px;width:calc(100% - 24px);max-width:406px;background:rgba(22,29,42,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;display:flex;justify-content:space-around;padding:8px 4px;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  nav button{background:none;border:none;color:#6E7A90;font:600 10.5px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:7px 9px;position:relative;border-radius:16px}
  nav button.on{color:#fff;background:var(--card2)}
  nav button.on svg{color:var(--red)}
  nav svg{width:22px;height:22px}
  .badge{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
  .overlay{position:fixed;inset:0;background:rgba(3,5,9,.7);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.show{display:flex}
  .sheet{background:var(--bg2);border-top:1px solid var(--line);width:100%;max-width:430px;border-radius:28px 28px 0 0;padding:20px 16px 24px;max-height:92vh;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .call{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:8px;text-decoration:none;color:var(--slate)}
  .call .n{font:800 26px Inter,sans-serif;width:64px;text-align:center;color:var(--red)}
  .call.main{background:linear-gradient(135deg,#FF6B73,#E1333E);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(255,77,87,.3)}.call.main .n{color:#fff}
  .sign{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .sign:last-child{border-bottom:none}
  .sign .e{font-size:22px;width:30px;text-align:center;flex:none}
  .back{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:19px;cursor:pointer;color:var(--slate)}
  .hero{background:radial-gradient(120% 140% at 0% 0%,#1B2A4A 0%,#111722 70%);color:#fff;margin:-16px -16px 0;padding:16px 16px 22px;border-radius:0 0 28px 28px;border-bottom:1px solid var(--line)}
  .hero .muted{color:#A9B3C6}
  .info{background:var(--card);border-radius:20px;padding:2px 14px;border:1px solid var(--line);margin-top:12px}
  .li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .li .ic{width:34px;height:34px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
  .li a{color:var(--blue)!important}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .days button{min-width:60px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:9px 4px;font:600 13px Inter,sans-serif;cursor:pointer;color:#C7CFDC;display:flex;flex-direction:column;align-items:center;gap:2px}
  .days button b{font-size:18px;color:#fff}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slots button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font:600 14px Inter,sans-serif;cursor:pointer;color:#C7CFDC}
  .days button.on,.slots button.on{background:var(--blue);border-color:var(--blue);color:#06101F}
  .days button.on b{color:#06101F}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:none;border-radius:10px;padding:10px 4px;font:600 13.5px Inter,sans-serif;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--card2);color:#fff;box-shadow:inset 0 0 0 1px #34405A}
  input[type=text],input[type=tel],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font:500 15px Inter,sans-serif;color:var(--slate);margin-bottom:10px}
  input::placeholder,textarea::placeholder{color:#5E6A80}
  label.f{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.1em}
  .sticky{position:fixed;bottom:0;width:100%;max-width:430px;padding:12px 16px 18px;background:linear-gradient(180deg,rgba(11,15,23,0) 0%,var(--bg) 35%);z-index:6}
  .ok{background:var(--card);border-radius:24px;padding:24px 18px;text-align:center;border:1px solid var(--line)}
  .ok .big{width:76px;height:76px;border-radius:50%;background:var(--green2);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 0 30px rgba(47,208,140,.25)}
  .code{font:800 26px Inter,sans-serif;letter-spacing:4px;background:var(--card2);border:1px dashed #3A4762;border-radius:14px;padding:10px;margin:12px 0;color:#fff}
  .appt{background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-left:4px solid var(--blue)}
  .mc{background:radial-gradient(120% 140% at 100% 0%,#3A2440 0%,#1D2535 55%,#161D2A 100%);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden;border:1px solid #34405A}
  .mc .k{color:#8D97AB;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .mc .v{font-weight:700;font-size:15px;margin-top:2px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:20;display:none;max-width:90%;text-align:center}
  .toast.show{display:block;animation:up .2s}
  .demo{font-size:12px;text-align:center;color:#6E7A90;margin:14px 0 0;line-height:1.5}
  .warn{background:var(--red2);border:1px solid #5A2530;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:#FFB3B8}
  .install{display:none;background:var(--blue2);border:1px solid #2A4372;border-radius:18px;padding:12px 14px;margin-top:12px;align-items:center;gap:12px}
  .install.show{display:flex}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const ECG='<svg class="ecg" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 24 H120 L130 24 L138 8 L146 36 L154 4 L162 24 H250 L258 24 L264 14 L270 30 L276 24 H400" stroke="#fff" stroke-width="2" fill="none"/></svg>';
const CITIES=['Душанбе','Хуҷанд','Кӯлоб','Бохтар'];
const SPEC={
 therapist:{n:'Терапевт',e:'🩺'},pediatr:{n:'Педиатр',e:'🧸'},cardio:{n:'Кардиолог',e:'❤️'},neuro:{n:'Невролог',e:'🧠'},
 gyn:{n:'Гинеколог',e:'🌸'},lor:{n:'ЛОР',e:'👂'},eye:{n:'Окулист',e:'👁️'},derm:{n:'Дерматолог',e:'🧴'},
 trauma:{n:'Травматолог',e:'🦴'},endo:{n:'Эндокринолог',e:'🧪'},surgeon:{n:'Ҷарроҳ',e:'🔪'},dent:{n:'Дандонпизишк',e:'🦷'}
};
const COLORS=['#3D7BFF','#1FB57A','#E8434D','#8A63FF','#E08A16','#13A6B5'];
// Маълумоти намунавӣ: клиникаҳо ва духтурон бофта шудаанд
const CL_T=[
 {k:'h',n:'Беморхонаи бисёрсоҳа',e:'🏥',er:true,dep:['therapist','cardio','neuro','surgeon','trauma','gyn'],h:'24/7'},
 {k:'d',n:'Маркази ташхис',e:'🔬',er:false,dep:['therapist','endo','cardio','eye','derm'],h:'08:00–18:00'},
 {k:'k',n:'Маркази тиббии кӯдакон',e:'🧸',er:true,dep:['pediatr','lor','eye','trauma'],h:'24/7'},
 {k:'f',n:'Клиникаи оилавӣ',e:'🏠',er:false,dep:['therapist','pediatr','gyn','lor','dent','derm'],h:'08:00–20:00'}
];
const AREAS={'Душанбе':['маркази шаҳр','ноҳияи Сино','ноҳияи Фирдавсӣ','ноҳияи Шоҳмансур'],'Хуҷанд':['маркази шаҳр','18-мкр','назди Панҷшанбе','соҳили Сирдарё'],'Кӯлоб':['маркази шаҳр','кӯчаи Борбад','маҳаллаи Сино','кӯчаи Шоҳтемур'],'Бохтар':['маркази шаҳр','мкр. 1','назди бозор','соҳили Вахш']};
const CLINICS=CITIES.flatMap((c,ci)=>CL_T.map((t,ti)=>({id:'c'+ci+t.k,k:t.k,city:c,n:t.n,e:t.e,er:t.er,dep:t.dep,h:t.h,a:AREAS[c][ti],dist:(1.2+((ci*3+ti*7)%9)*0.6).toFixed(1)})));
const FN_M=['Фирӯз','Бахтиёр','Ҷамшед','Дилшод','Рустам','Фаррух','Сӯҳроб','Комрон','Парвиз','Шерзод','Хуршед','Умед'];
const FN_F=['Мадина','Нилуфар','Зарина','Гулнора','Малика','Дилафрӯз','Шаҳноза','Сабрина','Мунира','Фарангис','Нигина','Озода'];
const LN=['Раҳимов','Назаров','Каримов','Саидов','Мирзоев','Шарипов','Ҳақназаров','Юсупов','Давлатов','Олимов','Холов','Ашуров'];
const SK=Object.keys(SPEC);
const DOCS=[];
CITIES.forEach((c,ci)=>SK.forEach((s,si)=>{
  const cls=CLINICS.filter(x=>x.city===c&&x.dep.includes(s));const cl=cls.length?cls[(si+ci)%cls.length]:CLINICS.find(x=>x.city===c&&x.k==='f');
  const f=(si+ci)%2===0, i=(si*5+ci*3)%12;
  const ln=LN[(si*7+ci)%12]+(f?'а':'');
  DOCS.push({id:'d'+ci+'-'+si,city:c,spec:s,n:(f?FN_F[i]:FN_M[i])+' '+ln,f,exp:4+((si*7+ci*5)%22),clinic:(cl||CLINICS.find(x=>x.city===c)).id,price:[60,80,100,120,150][(si+ci)%5],online:(si+ci)%3!==1,lang:'тоҷикӣ, русӣ'+((si+ci)%4===0?', англисӣ':''),col:COLORS[(si+ci)%COLORS.length]});
}));
const DAYS=['Яш','Дш','Сш','Чш','Пш','Ҷм','Шб'];
const MONTHS=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];
let S=load()||{city:'Душанбе',appts:[],card:{name:'',blood:'',allergy:'',chronic:'',meds:'',contact:''}};
let tab='home',view=null,spec='all',q='',cur=null,bk=null;
function load(){try{const r=localStorage.getItem('tabib');return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem('tabib',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),2600)}
function closeSheet(){document.getElementById('ov').classList.remove('show')}
function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('ov').classList.add('show');document.getElementById('sheet').scrollTop=0}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
const D=id=>DOCS.find(x=>x.id===id), CL=id=>CLINICS.find(x=>x.id===id);
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2)}
function docAva(d,s){return `<div class="ava" style="background:${d.col};${s?`width:${s}px;height:${s}px;font-size:${s*.36}px;border-radius:${s/3.4}px`:''}">${initials(d.n)}</div>`}
function nextDays(){const o=[];const d=new Date();for(let i=0;i<9;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()!==0)o.push(x)}return o.slice(0,7)}
function fmtDay(v){const d=new Date(v+'T12:00:00');return `${d.getDate()} ${MONTHS[d.getMonth()]}`}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function slotsFor(d,day){const all=['09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30','15:00','15:30','16:00','16:30'];const seed=[...d.id].reduce((x,c)=>x+c.charCodeAt(0),0)+(+day.slice(8))*3;return all.filter((s,i)=>(i+seed)%4!==0&&(i*7+seed)%5!==0)}
function dayLabel(x){const t=new Date();t.setHours(0,0,0,0);const y=new Date(x);y.setHours(0,0,0,0);const diff=Math.round((y-t)/864e5);return diff===0?'Имрӯз':diff===1?'Пагоҳ':DAYS[x.getDay()]+', '+x.getDate()}
function nearest(d){const days=nextDays();for(const x of days){const v=iso(x);let s=slotsFor(d,v);if(x.toDateString()===new Date().toDateString()){const n=new Date();s=s.filter(t=>{const [h,m]=t.split(':');return +h*60+ +m>n.getHours()*60+n.getMinutes()+30})}if(s.length)return dayLabel(x)+', '+s[0]}return '—'}

/* ---------- SOS ---------- */
function sos(){
  const c=S.card;
  openSheet(`<div class="row" style="gap:12px"><div class="ava" style="background:var(--red)">SOS</div><div><h1 style="font-size:24px">Ёрии таъҷилӣ</h1><p class="muted">Агар ҳаёт дар хатар бошад — дарҳол занг занед</p></div></div>
   <div style="margin-top:14px">
    <a class="call main" href="tel:103"><span class="n">103</span><div><h3 style="font-size:17px">Ёрии таъҷилии тиббӣ</h3><p style="font-size:13px;opacity:.9">Занг задан</p></div></a>
    <a class="call" href="tel:112"><span class="n">112</span><div><h3>Рақами ягонаи таъҷилӣ</h3><p class="muted">Ҳамаи хадамоти наҷот</p></div></a>
    <div class="grid2"><a class="call" href="tel:101" style="margin:0"><span class="n" style="width:46px;font-size:22px">101</span><div><h3 style="font-size:14px">Сӯхтор</h3></div></a><a class="call" href="tel:102" style="margin:0"><span class="n" style="width:46px;font-size:22px">102</span><div><h3 style="font-size:14px">Милиса</h3></div></a></div>
   </div>
   <h2>Ба диспетчер бигӯед</h2>
   <div class="info" style="margin-top:0">

  ${S.appts.length?S.appts.map((x,i)=>{const d=D(x.doc),c=CL(d.clinic),s=ST[x.st];return `<div class="appt" style="border-left-color:${s[2]};margin-top:12px"><div class="row between"><span class="tag ${s[1]}" style="margin:0">${s[0]}</span><span class="muted">${x.code}</span></div>
   <div class="row" style="margin-top:10px">${docAva(d,46)}<div><h3>${esc(d.n)}</h3><p class="muted">${SPEC[d.spec].n} · ${x.type==='online'?'💻 онлайн':c.n}</p></div></div>
   <div class="row" style="margin-top:10px;gap:16px"><b>📅 ${fmtDay(x.day)}</b><b>🕐 ${x.time}</b>${x.who!=='self'?`<span class="muted">${x.who==='child'?'кӯдак':'наздикон'}: ${esc(x.name)}</span>`:''}</div>
   ${x.st!=='cancel'?`<button class="btn ghost" style="margin-top:10px;padding:10px" onclick="S.appts[${i}].st='cancel';save();render();toast('Сабт бекор шуд')">Бекор кардан</button>`:''}</div>`}).join(''):`<div class="ok" style="margin-top:14px"><div class="big" style="background:#222A38;color:var(--slate)">📅</div><h3>Ҳоло сабт нест</h3><p class="muted" style="margin:6px 0 14px">Духтурро интихоб кунед ва ба қабул сабт шавед.</p><button class="btn" onclick="tab='docs';render()">Ҷустуҷӯи духтур</button></div>`}`;
}
function meView(){
  const c=S.card;
  const f=(k,l,ph)=>`<label class="f">${l}</label><input type="text" value="${esc(c[k])}" placeholder="${ph}" oninput="S.card.${k}=this.value;save()">`;
  return `<h1>Корти тиббии ман</h1><p class="muted" style="margin:4px 0 12px">Ин маълумот дар ҳолати таъҷилӣ ба духтур кӯмак мекунад. Он танҳо дар телефони шумо нигоҳ дошта мешавад.</p>
  <div class="mc"><div class="row between"><div class="row"><span class="cross" style="width:24px;height:24px"></span><b class="cond" style="font-size:18px">КОРТИ ТИББӢ</b></div><span class="k">${esc(c.blood)||'—'}</span></div><div class="v" style="font-size:20px;margin-top:14px">${esc(c.name)||'Ному насаб'}</div><div class="grid2" style="margin-top:10px"><div><div class="k">Аллергия</div><div class="v">${esc(c.allergy)||'—'}</div></div><div><div class="k">Тамоси наздик</div><div class="v">${esc(c.contact)||'—'}</div></div></div></div>
  ${f('name','Ному насаб','')}
  <label class="f">Гурӯҳи хун</label><select onchange="S.card.blood=this.value;save();render()"><option value="">— интихоб кунед —</option>${['O(I) Rh+','O(I) Rh−','A(II) Rh+','A(II) Rh−','B(III) Rh+','B(III) Rh−','AB(IV) Rh+','AB(IV) Rh−'].map(b=>`<option ${c.blood===b?'selected':''}>${b}</option>`).join('')}</select>
  ${f('allergy','Аллергия','масалан: пенитсиллин, асал')}
  ${f('chronic','Бемориҳои музмин','масалан: диабет, фишори баланд')}
  ${f('meds','Доруҳое, ки мегиред','')}
  ${f('contact','Тамоси наздик','ном ва рақам')}
  <button class="btn" onclick="render();toast('Корт нигоҳ дошта шуд ✓')">Нигоҳ доштан</button>`;
}
S.appts.forEach(a=>{if(a.st==='wait')a.st='ok'});save();
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(tab==='home'&&!view)render()});
function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render()})}
try{if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}
render();
try{if(new URLSearchParams(location.search).get('sos'))sos()}catch(e){}
</script>
</body>
